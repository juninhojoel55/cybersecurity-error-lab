services:
  - type: web
    name: cybersecurity-error-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_PATH
        value: /tmp/lab.db
      - key: UPLOAD_DIR
        value: /tmp/uploads
